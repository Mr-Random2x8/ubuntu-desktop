name: Run Android
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM permissions
        run: |
          # بدون هذه الخطوة يفشل emulator بـ permission denied على /dev/kvm [[51]]
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            echo "===== Android is alive ====="
            adb devices
            echo "--- version ---"
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.model
            echo "--- installed packages ---"
            adb shell pm list packages | head -20
            echo "===== write commands INTO android ====="
            adb shell "echo hello-from-github > /sdcard/test.txt"
            adb shell "cat /sdcard/test.txt"
            adb shell "ls -la /sdcard"
            echo "===== capture screen ====="
            adb exec-out screencap -p > screen.png
            ls -lh screen.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: android-screen
          path: screen.png
