name: Eileri PoC - External Observer
on:
  workflow_dispatch:
jobs:
  observer:
    runs-on: ubuntu-latest
    steps:
      - name: Install QEMU + socat
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 socat

      - name: Boot bare guest (SeaBIOS only) with external monitor
        run: |
          qemu-system-x86_64 \
            -accel tcg \
            -m 512 -smp 1 -display none \
            -monitor unix:mon.sock,server,nowait \
            -serial file:serial.log \
            -daemonize -pidfile qemu.pid
          echo "QEMU PID = $(cat qemu.pid)"

          sleep 3
          if [ ! -S mon.sock ]; then
            echo "FAIL: mon.sock not created"
            cat serial.log 2>/dev/null
            exit 1
          fi
          if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
            echo "FAIL: QEMU died after boot"
            cat serial.log 2>/dev/null
            exit 1
          fi
          echo "OK: QEMU alive, mon.sock ready"

      - name: OBSERVE from outside (no guest agent)
        run: |
          set +e
          M() { echo "$1" | socat -t5 - UNIX-CONNECT:mon.sock; }

          echo "=== 1) VM status (observer sees guest existence) ==="
          M "info status"

          echo "=== 2) CPU registers from outside ==="
          M "info registers" | head -25

          echo "=== 3) guest physical memory read (xp) from outside ==="
          M "xp/16xg 0x100000"

          echo "=== 4) control: freeze guest from outside (Decision System) ==="
          M "stop"
          M "info status"

          echo "=== 5) resume then powerdown ==="
          M "cont"
          sleep 2
          M "system_powerdown"
          echo "OK: proof complete - read + control from outside guest"

      - name: Keep alive
        run: for i in $(seq 1 60); do sleep 60; done
