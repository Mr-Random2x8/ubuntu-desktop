name: Ubuntu Desktop VM

on:
  workflow_dispatch:

jobs:
  ubuntu_desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Ubuntu VM with GUI
        uses: vmactions/ubuntu-vm@v1
        with:
          mem: 8192
          debug-on-error: true
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq xfce4 xfce4-terminal lightdm

            # تفعيل كلمة سر للمستخدم الرسمي ubuntu (أمر Ubuntu الرسمي للصور السحابية)
            echo "ubuntu:ubuntu" | chpasswd

            # دخول تلقائي بمفاتيح LightDM الرسمية
            mkdir -p /etc/lightdm/lightdm.conf.d
            printf '[Seat:*]\nautologin-user=ubuntu\nautologin-user-timeout=0\n' > /etc/lightdm/lightdm.conf.d/99-autologin.conf

            systemctl start lightdm
            sleep 10
            echo "🎉 افتح رابط WebVNC — دخول تلقائي بالمستخدم الرسمي ubuntu"
            exit 1
