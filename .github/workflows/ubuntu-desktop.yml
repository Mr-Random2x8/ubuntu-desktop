name: Ubuntu Desktop VM

on:
  workflow_dispatch:

jobs:
  ubuntu_desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Ubuntu VM with GUI
        uses: vmactions/ubuntu-vm@v1
        with:
          mem: 8192
          debug-on-error: true
          run: |
            export DEBIAN_FRONTEND=noninteractive
            echo "🔧 تثبيت سطح المكتب + المحرك الرسومي..."
            apt-get update -qq
            apt-get install -y -qq xfce4 xfce4-terminal xorg lightdm lightdm-gtk-greeter

            echo "🔑 تفعيل كلمة سر للمستخدم الرسمي ubuntu..."
            echo "ubuntu:ubuntu" | chpasswd

            echo "🖥️ إعداد LightDM (شاشة tty1 + دخول تلقائي)..."
            mkdir -p /etc/lightdm/lightdm.conf.d
            printf '[LightDM]\nminimum-vt=1\n[Seat:*]\nautologin-user=ubuntu\nautologin-user-timeout=0\n' > /etc/lightdm/lightdm.conf.d/99-autologin.conf

            echo "🚀 التبديل للوضع الرسومي..."
            systemctl isolate graphical.target
            sleep 10

            echo "🩺 تشخيص:"
            pgrep -a Xorg || echo "❌ Xorg ما يشتغل"
            systemctl is-active lightdm

            echo ""
            echo "###########################################"
            echo "🎉 افتح رابط WebVNC من فوق"
            echo "لو سألك: ubuntu / ubuntu"
            echo "###########################################"
            exit 1
