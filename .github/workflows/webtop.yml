name: Debian GUI + SSH

on:
  workflow_dispatch:

jobs:
  debian_gui:
    runs-on: ubuntu-latest
    steps:
      - name: Start Debian with Openbox + SSH + noVNC
        run: |
          echo "🚀 تشغيل حاوية Debian..."
          
          docker run -d --name debian-gui \
            --shm-size="2g" \
            -p 2222:22 \
            -p 6080:6080 \
            debian:bookworm-slim bash -c '
              export DEBIAN_FRONTEND=noninteractive
              
              echo "⏳ تثبيت الحزم (قد يستغرق 3-4 دقائق)..."
              apt-get update -qq
              apt-get install -y \
                openssh-server xvfb openbox \
                tint2 pcmanfm lxterminal lxappearance nitrogen picom \
                x11vnc novnc websockify nano curl wget git build-essential \
                fonts-dejavu-core dbus-x11 x11-xserver-utils procps net-tools
              
              echo "🔐 إعداد SSH..."
              mkdir -p /run/sshd
              mkdir -p /root/.ssh && chmod 700 /root/.ssh
              echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKabR0ItQG3t0UFr9gk0QlL3OzkAtrfgNLkWJ9y4CWZk youssefhidour@youssefhidour-hpprobook640g1" > /root/.ssh/authorized_keys
              chmod 600 /root/.ssh/authorized_keys
              mkdir -p /etc/ssh
              echo "PermitRootLogin yes" >> /etc/ssh/sshd_config
              echo "PasswordAuthentication yes" >> /etc/ssh/sshd_config
              echo "root:debian" | chpasswd
              
              /usr/sbin/sshd || echo "⚠️ فشل تشغيل sshd"
              
              echo "🖥️ تشغيل Xvfb..."
              Xvfb :1 -screen 0 1280x720x24 &
              sleep 5
              export DISPLAY=:1
              
              echo "🎨 تشغيل Openbox و tint2..."
              openbox-session > /tmp/openbox.log 2>&1 &
              sleep 2
              tint2 > /tmp/tint2.log 2>&1 &
              sleep 2
              
              echo "📡 تشغيل x11vnc..."
              x11vnc -display :1 -nopw -listen 0.0.0.0 -forever -rfbport 5900 > /tmp/x11vnc.log 2>&1 &
              sleep 3
              
              echo "🌐 تشغيل websockify..."
              websockify --web=/usr/share/novnc 6080 localhost:5900 > /tmp/websockify.log 2>&1 &
              sleep 3
              
              echo "✅ تم التشغيل! انتظار الاتصالات..."
              while true; do sleep 60; done
            '

          echo "⏳ انتظار ذكي حتى تبدأ الخدمات..."
          for i in {1..60}; do
            if docker exec debian-gui netstat -tuln 2>/dev/null | grep -q ":6080"; then
              echo "✅ المنفذ 6080 جاهز بعد $((i*5)) ثانية!"
              break
            fi
            echo "⏳ محاولة $i/60 — انتظار 5 ثوانٍ..."
            sleep 5
          done

          echo "📋 تشخيص مفصل:"
          docker ps -a | grep debian-gui
          echo "--- حالة الحاوية ---"
          docker inspect debian-gui --format '{{.State.Status}} - Exit Code: {{.State.ExitCode}}'
          echo "--- آخر 30 سطر من السجلات ---"
          docker logs debian-gui 2>&1 | tail -n 30
          echo "--- حالة المنافذ داخل الحاوية ---"
          docker exec debian-gui netstat -tuln 2>/dev/null || echo "netstat فشل"
          echo "--- ملفات السجلات الداخلية ---"
          docker exec debian-gui cat /tmp/x11vnc.log 2>/dev/null | tail -n 5
          docker exec debian-gui cat /tmp/websockify.log 2>/dev/null | tail -n 5

          echo "🌐 إنشاء نفق Cloudflare للواجهة..."
          curl -sLo cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:6080 > web.log 2>&1 &
          sleep 10
          WEB_LINK=$(grep -oE "https://[a-z0-9-]+\.trycloudflare\.com" web.log | head -1)

          echo "🔗 إنشاء نفق SSH..."
          ./cloudflared tunnel --url tcp://localhost:2222 > ssh.log 2>&1 &
          sleep 10
          SSH_LINK=$(grep -oE "tcp://[a-z0-9-]+\.trycloudflare\.com:[0-9]+" ssh.log | head -1)

          echo ""
          echo "###########################################"
          echo "🖥️ الواجهة الرسومية:"
          echo "$WEB_LINK/vnc.html?autoconnect=true"
          echo ""
          echo "🔐 SSH:"
          echo "$SSH_LINK"
          echo "كلمة السر: debian"
          echo "###########################################"

          for i in $(seq 1 360); do sleep 60; done
