name: Ubuntu Live VM (Real OS)

on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Boot official Ubuntu Live ISO in QEMU
        run: |
          echo "📥 تنزيل ISO أوبنتو الرسمي..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 novnc websockify
          ISO=$(curl -s https://releases.ubuntu.com/24.04/ | grep -oE 'ubuntu-24\.04(\.[0-9]+)?-desktop-amd64\.iso' | head -1)
          curl -Lo ubuntu.iso "https://releases.ubuntu.com/24.04/$ISO"

          echo "🖥️ إقلاع VM حقيقي (KVM)..."
          qemu-system-x86_64 -enable-kvm -m 6144 -smp 4 \
            -cdrom ubuntu.iso -boot order=d \
            -device virtio-net-pci,netdev=n0 -netdev user,id=n0 \
            -vga virtio -display none -vnc :0 &
          sleep 5

          echo "🌐 noVNC (واجهة ويب رسمية)..."
          /usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &
          sleep 5

          echo "🔗 نفق Cloudflare الرسمي..."
          curl -Lo cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:6080 > tunnel.log 2>&1 &
          sleep 15
          LINK=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1)
          echo "###########################################"
          echo "🎉 افتح بالمتصفح:"
          echo "$LINK/vnc.html?autoconnect=true"
          echo "###########################################"
          for i in $(seq 1 330); do sleep 60; done
