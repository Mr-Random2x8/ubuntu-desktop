name: Debian XFCE Desktop

on:
  workflow_dispatch:

jobs:
  debian_xfce:
    runs-on: ubuntu-latest
    steps:
      - name: Start Debian with XFCE + SSH + noVNC
        run: |
          echo "🚀 تشغيل حاوية Debian مع سطح مكتب XFCE..."

          docker run -d --name debian-xfce \
            --shm-size="2g" \
            -p 2222:22 \
            -p 6080:6080 \
            debian:bookworm-slim bash -c '
              export DEBIAN_FRONTEND=noninteractive

              echo "⏳ تثبيت XFCE والأدوات (3-5 دقائق)..."
              apt-get update -qq
              apt-get install -y \
                xfce4 xfce4-terminal dbus-x11 \
                xvfb x11vnc novnc websockify \
                openssh-server nano curl wget git build-essential \
                fonts-dejavu-core procps net-tools

              echo "🔐 إعداد SSH..."
              mkdir -p /run/sshd
              mkdir -p /root/.ssh && chmod 700 /root/.ssh
              echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKabR0ItQG3t0UFr9gk0QlL3OzkAtrfgNLkWJ9y4CWZk youssefhidour@youssefhidour-hpprobook640g1" > /root/.ssh/authorized_keys
              chmod 600 /root/.ssh/authorized_keys
              echo "PermitRootLogin yes" >> /etc/ssh/sshd_config
              echo "PasswordAuthentication yes" >> /etc/ssh/sshd_config
              echo "root:debian" | chpasswd
              /usr/sbin/sshd || echo "⚠️ sshd فشل"

              echo "🖥️ تشغيل شاشة افتراضية..."
              Xvfb :1 -screen 0 1366x768x24 &
              sleep 4
              export DISPLAY=:1

              echo "🎨 تشغيل سطح مكتب XFCE..."
              startxfce4 > /tmp/xfce.log 2>&1 &
              sleep 6

              echo "📡 تشغيل x11vnc..."
              x11vnc -display :1 -nopw -listen 0.0.0.0 -forever -rfbport 5900 > /tmp/x11vnc.log 2>&1 &
              sleep 3

              echo "🌐 تشغيل noVNC (واجهة الويب)..."
              websockify --web=/usr/share/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
              sleep 3

              echo "✅ كل الخدمات شغالة!"
              while true; do sleep 60; done
            '

          echo "⏳ انتظار ذكي حتى يجهز المنفذ 6080 (حتى 6 دقائق)..."
          for i in $(seq 1 72); do
            if docker exec debian-xfce netstat -tuln 2>/dev/null | grep -q ":6080"; then
              echo "✅ المنفذ 6080 جاهز بعد $((i*5)) ثانية!"
              break
            fi
            sleep 5
          done

          echo "📋 تشخيص:"
          docker ps -a | grep debian-xfce
          docker inspect debian-xfce --format "الحالة: {{.State.Status}} | كود الخروج: {{.State.ExitCode}}"
          echo "--- المنافذ الشغالة ---"
          docker exec debian-xfce netstat -tuln 2>/dev/null | grep -E ":(22|5900|6080)" || echo "لا منافذ بعد"

          echo "🌐 نفق Cloudflare للواجهة الرسومية..."
          curl -sLo cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:6080 > web.log 2>&1 &
          sleep 10
          WEB_LINK=$(grep -oE "https://[a-z0-9-]+\.trycloudflare\.com" web.log | head -1)

          echo "🔗 نفق Cloudflare للـ SSH..."
          ./cloudflared tunnel --url tcp://localhost:2222 > ssh.log 2>&1 &
          sleep 10
          SSH_LINK=$(grep -oE "tcp://[a-z0-9-]+\.trycloudflare\.com:[0-9]+" ssh.log | head -1)

          echo ""
          echo "###########################################"
          echo "🖥️ سطح مكتب XFCE (افتح في المتصفح):"
          echo "$WEB_LINK/vnc.html?autoconnect=true"
          echo ""
          echo "🔐 SSH:"
          echo "$SSH_LINK"
          echo "كلمة السر: debian"
          echo "###########################################"

          for i in $(seq 1 360); do sleep 60; done
