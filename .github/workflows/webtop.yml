name: Ubuntu Web Desktop

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Start Ubuntu desktop in browser
        run: |
          echo "🚀 تشغيل سطح مكتب Ubuntu (صورة WebTop الرسمية)..."
          docker run -d --name webtop --shm-size="1gb" \
            -e PUID=1000 -e PGID=1000 \
            -p 3000:3000 \
            lscr.io/linuxserver/webtop:ubuntu-xfce

          echo "🔗 إنشاء رابط عبر Cloudflare الرسمي..."
          curl -Lo cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:3000 > tunnel.log 2>&1 &
          sleep 15

          LINK=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1)
          echo ""
          echo "###########################################"
          echo "🎉 افتح هذا الرابط في متصفحك:"
          echo "$LINK"
          echo "###########################################"

          for i in $(seq 1 330); do sleep 60; done
