name: Debian GUI + SSH

on:
  workflow_dispatch:

jobs:
  debian_gui:
    runs-on: ubuntu-latest
    steps:
      - name: Start Debian with Openbox + SSH + noVNC
        run: |
          echo "🚀 تشغيل حاوية Debian مع واجهة رسومية..."
          
          docker run -d --name debian-gui --privileged \
            --shm-size="2g" \
            -p 2222:22 \
            -p 6080:6080 \
            debian:bookworm-slim bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              
              echo " تحديث قوائم الحزم..."
              apt-get update -qq
              
              echo " تثبيت الحزم (قد يستغرق 2-3 دقائق)..."
              apt-get install -y \
                openssh-server xorg openbox \
                tint2 pcmanfm lxterminal lxappearance nitrogen picom \
                x11vnc novnc websockify nano curl wget git build-essential \
                fonts-dejavu-core dbus-x11 x11-xserver-utils \
                || { echo "فشل التثبيت!"; exit 1; }
              
              echo "🔐 إعداد SSH..."
              mkdir -p /root/.ssh && chmod 700 /root/.ssh
              echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKabR0ItQG3t0UFr9gk0QlL3OzkAtrfgNLkWJ9y4CWZk youssefhidour@youssefhidour-hpprobook640g1" > /root/.ssh/authorized_keys
              chmod 600 /root/.ssh/authorized_keys
              mkdir -p /etc/ssh
              echo "PermitRootLogin yes" >> /etc/ssh/sshd_config
              echo "PasswordAuthentication yes" >> /etc/ssh/sshd_config
              echo "root:debian" | chpasswd
              /usr/sbin/sshd || { echo "فشل تشغيل SSH"; exit 1; }
              
              echo "🖥️ تشغيل Xvfb و Openbox..."
              Xvfb :1 -screen 0 1280x720x24 &
              sleep 5
              export DISPLAY=:1
              openbox &
              tint2 &
              sleep 5
              
              echo "📡 تشغيل VNC و noVNC..."
              x11vnc -display :1 -nopw -listen 0.0.0.0 -forever &
              sleep 3
              websockify --web=/usr/share/novnc 6080 localhost:5900 &
              sleep 3
              
              echo "✅ كل الخدمات شغالة!"
              tail -f /dev/null
            '

          echo "⏳ انتظار 20 ثانية لبدء الخدمات..."
          sleep 20

          echo "📋 تشخيص الحاوية:"
          docker ps -a | grep debian-gui || echo "❌ الحاوية توقفت!"
          echo "--- آخر 20 سطر من السجلات ---"
          docker logs debian-gui 2>&1 | tail -n 20

          echo " إنشاء نفق Cloudflare للواجهة..."
          curl -sLo cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:6080 > web.log 2>&1 &
          sleep 10
          WEB_LINK=$(grep -oE "https://[a-z0-9-]+\.trycloudflare\.com" web.log | head -1)

          echo "🔗 إنشاء نفق Cloudflare للـ SSH..."
          ./cloudflared tunnel --url tcp://localhost:2222 > ssh.log 2>&1 &
          sleep 10
          SSH_LINK=$(grep -oE "tcp://[a-z0-9-]+\.trycloudflare\.com:[0-9]+" ssh.log | head -1)

          echo ""
          echo "###########################################"
          echo "🖥️ الواجهة الرسومية:"
          echo "$WEB_LINK/vnc.html?autoconnect=true"
          echo ""
          echo "🔐 SSH:"
          echo "$SSH_LINK"
          echo "كلمة السر: debian"
          echo "###########################################"

          for i in $(seq 1 360); do sleep 60; done
